name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          check-latest: true
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - env:
          HUSKY: 0
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Verify release tag
        run: |
          version="$(
            node --input-type=module <<'NODE'
            import { readFileSync } from "node:fs";

            const manifests = [
              "package.json",
              "packages/dantalion-core/package.json",
              "packages/dantalion-i18n/package.json",
              "packages/dantalion-cli/package.json",
            ];
            const versions = manifests.map((path) => {
              const { version } = JSON.parse(readFileSync(path, "utf8"));
              return version;
            });

            if (versions.some((candidate) => candidate !== versions[0])) {
              console.error("Package versions differ: " + versions.join(", "));
              process.exit(1);
            }

            process.stdout.write(versions[0]);
          NODE
          )"
          expected_tag="v${version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match ${expected_tag}" >&2
            exit 1
          fi
          echo "Releasing ${version}"
      - run: pnpm run lint
      - run: pnpm run test
      - run: pnpm run build
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if pnpm run is:prerelease >/dev/null 2>&1; then
            pnpm publish -r --tag next --provenance --no-git-checks --access public
          else
            pnpm publish -r --provenance --no-git-checks --access public
          fi
